// lwjgl3: Windows 데스크톱 창으로 실행하는 부분
apply plugin: 'application'

// assets 폴더(글꼴, 수치 JSON)를 실행 파일에 함께 넣는다
sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'com.yongsa.lwjgl3.Lwjgl3Launcher'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        applicationDefaultJvmArgs += ['-XstartOnFirstThread']
    }
}

// gradlew run 의 작업 폴더를 프로젝트 루트로 고정한다
tasks.named('run') {
    workingDir = rootProject.projectDir
}

// 한 파일로 실행할 수 있는 jar: gradlew lwjgl3:dist → lwjgl3/build/libs/yongsa-game-0.1.0.jar
tasks.register('dist', Jar) {
    group = 'build'
    description = '실행 가능한 jar 하나로 묶는다'
    archiveBaseName = 'yongsa-game'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

// Windows users can also double-click the launcher in the extracted distribution.
distributions.main.contents.from(rootProject.file('용사가 다한다.exe'))

// 개발용 렉 측정: gradlew lwjgl3:perf (맵 전체를 두 바퀴 돌며 프레임 시간을 잰다)
tasks.register('perf', JavaExec) {
    group = 'verification'
    description = '맵 전체를 돌며 프레임 시간을 잰다'
    mainClass = 'com.yongsa.lwjgl3.PerfLauncher'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootProject.projectDir
    jvmArgs = ['-Dfile.encoding=UTF-8'] + (project.findProperty('perfJvm') ?: '').tokenize(' ')
    args = (project.findProperty('laps') ?: '2').tokenize(' ')
}
